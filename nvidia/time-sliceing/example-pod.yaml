apiVersion: v1
kind: Pod
metadata:
  name: inference-a
spec:
  containers:
    - name: app
      image: nvcr.io/nvidia/pytorch:24.01-py3
      resources:
        limits:
          nvidia.com/gpu: 1
      command: ["python", "-c"]
      args:
        - |
          import time, torch
          while True:
              x = torch.randn(1024, 1024, device="cuda")
              y = x @ x
              time.sleep(0.1)
---
apiVersion: v1
kind: Pod
metadata:
  name: inference-b
spec:
  containers:
    - name: app
      image: nvcr.io/nvidia/pytorch:24.01-py3
      resources:
        limits:
          nvidia.com/gpu: 1
      command: ["nvidia-smi", "-l", "2"]
---
apiVersion: v1
kind: Pod
metadata:
  name: inference-c
spec:
  containers:
    - name: app
      image: nvcr.io/nvidia/pytorch:24.01-py3
      resources:
        limits:
          nvidia.com/gpu: 1
      command: ["python", "-m", "http.server"]
---
apiVersion: v1
kind: Pod
metadata:
  name: inference-d
spec:
  containers:
    - name: app
      image: nvcr.io/nvidia/pytorch:24.01-py3
      resources:
        limits:
          nvidia.com/gpu: 1
      command: ["bash", "-c", "while true; do nvidia-smi; sleep 5; done"]